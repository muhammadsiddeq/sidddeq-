<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muhammad Siddeq | Website Designer &amp; Developer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-dark: #0d0716;
      --bg-card: rgba(22, 13, 38, 0.78);
      --purple-primary: #9333ea;
      --purple-accent: #a855f7;
      --purple-light: #c084fc;
      --purple-glow: rgba(168, 85, 247, 0.45);
      --gradient-primary: linear-gradient(135deg, #7e22ce 0%, #a855f7 55%, #ec4899 100%);
      --text-white: #ffffff;
      --text-gray: #cbd5e1;
      --text-muted: #94a3b8;
      --border-subtle: rgba(168, 85, 247, 0.22);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      overflow-x: hidden;
      line-height: 1.65;
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.16) 0%, transparent 70%);
      z-index: -1;
      pointer-events: none;
    }

    body::before {
      top: -110px;
      left: -110px;
    }

    body::after {
      bottom: -120px;
      right: -110px;
    }

    /* Navbar */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(13, 7, 22, 0.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-subtle);
    }

    .navbar {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--text-white);
      text-decoration: none;
      letter-spacing: 0.5px;
      cursor: pointer;
    }

    .logo span {
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-gray);
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.3s ease;
      position: relative;
      cursor: pointer;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--text-white);
    }

    .nav-links a.active::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -6px;
      width: 100%;
      height: 2px;
      background: var(--gradient-primary);
      border-radius: 2px;
    }

    .btn-gradient {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.68rem 1.5rem;
      background: var(--gradient-primary);
      color: var(--text-white);
      font-weight: 600;
      font-size: 0.92rem;
      border: none;
      border-radius: 50px;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 4px 18px rgba(168, 85, 247, 0.35);
    }

    .btn-gradient:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 26px rgba(168, 85, 247, 0.65);
    }

    .btn-outline {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.68rem 1.5rem;
      border: 1px solid var(--purple-light);
      color: var(--text-white);
      background: transparent;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-outline:hover {
      background: rgba(168, 85, 247, 0.16);
      transform: translateY(-2px);
    }

    .menu-toggle {
      display: none;
      flex-direction: column;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
    }

    .menu-toggle span {
      width: 26px;
      height: 2.5px;
      background: var(--text-white);
      border-radius: 2px;
      transition: 0.3s;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* Page View Switching */
    .page-view {
      display: none;
      animation: fadeUp 0.45s ease forwards;
    }

    .page-view.active {
      display: block;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .section-block {
      padding: 2.75rem 0;
    }

    .section-title {
      font-size: clamp(1.6rem, 3.2vw, 2.2rem);
      font-weight: 700;
      color: var(--text-white);
      margin-bottom: 1.55rem;
      text-align: center;
    }

    .section-title span {
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Home Hero & Sections */
    .hero {
      padding: 3.8rem 0 2.2rem;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 2.5rem;
      align-items: center;
    }

    .hero-small {
      font-size: 0.98rem;
      color: var(--purple-light);
      font-weight: 500;
      margin-bottom: 0.45rem;
    }

    .hero h1 {
      font-size: clamp(2.25rem, 4.8vw, 3.4rem);
      font-weight: 700;
      line-height: 1.18;
      margin-bottom: 0.9rem;
    }

    .hero h1 span.gradient-text {
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-desc {
      color: var(--text-gray);
      font-size: 1rem;
      max-width: 580px;
      margin-bottom: 1.6rem;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .social-links {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .social-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-white);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
    }

    .social-btn:hover {
      transform: translateY(-3px);
      border-color: var(--purple-accent);
      background: var(--gradient-primary);
      box-shadow: 0 8px 22px var(--purple-glow);
    }

    .portrait-wrap {
      display: flex;
      justify-content: center;
    }

    .portrait-frame {
      width: 310px;
      max-width: 100%;
      padding: 5px;
      border-radius: 160px 160px 28px 28px;
      background: var(--gradient-primary);
      box-shadow: 0 18px 48px var(--purple-glow);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .portrait-frame:hover {
      transform: translateY(-7px);
      box-shadow: 0 22px 58px rgba(168, 85, 247, 0.7);
    }

    .portrait-frame img {
      width: 100%;
      aspect-ratio: 4 / 4.6;
      object-fit: cover;
      object-position: top center;
      border-radius: 155px 155px 24px 24px;
      display: block;
      background: #160d26;
    }

    .stats-bar {
      margin-top: 2.6rem;
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 1.4rem 1.5rem;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.38);
    }

    .stat-item {
      text-align: center;
      padding: 0.4rem 1rem;
      position: relative;
    }

    .stat-item:not(:last-child)::after {
      content: '';
      position: absolute;
      right: 0;
      top: 15%;
      height: 70%;
      width: 1px;
      background: var(--border-subtle);
    }

    .stat-highlight {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--purple-light);
      margin-bottom: 0.15rem;
    }

    .stat-label {
      font-size: 0.9rem;
      color: var(--text-gray);
    }

    .about-preview-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 2.2rem 1.8rem;
      text-align: center;
      max-width: 860px;
      margin: 0 auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.38);
    }

    .about-preview-card p {
      color: var(--text-gray);
      font-size: 1rem;
      margin-bottom: 1.4rem;
    }

    .three-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.75rem;
    }

    .project-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.42);
      transition: transform 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
    }

    .project-card:hover {
      transform: translateY(-7px);
      border-color: var(--purple-accent);
      box-shadow: 0 14px 36px var(--purple-glow);
    }

    .project-thumb {
      height: 185px;
      overflow: hidden;
      background: #1b0f30;
    }

    .project-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.45s ease;
      display: block;
    }

    .project-card:hover .project-thumb img {
      transform: scale(1.07);
    }

    .project-body {
      padding: 1.35rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .project-body h3 {
      font-size: 1.12rem;
      margin-bottom: 0.65rem;
    }

    .tags {
